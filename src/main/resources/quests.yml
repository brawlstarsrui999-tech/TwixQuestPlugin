# =========================================================================
# TwixQuestPlugin — quests.yml
# Полностью настраиваемый файл квестов. Допустимые типы:
#   MINE_BLOCK, CRAFT_ITEM, RECEIVE_ITEM, KILL_MOB, KILL_PLAYER,
#   ENTER_WORLD, VISIT_STRUCTURE, TRADE_VILLAGER, SELL_TO_BUYER,
#   REACH_BALANCE, DEPOSIT_ITEM.
#
# Поддерживаемые поля:
#   - name, description, type, amount, material, entity-type, world-env,
#     world-name, structure, structure-radius, allow-leftover, silent.
#   - reward: { items: [...], vault-coins: int, twix-coins: int,
#               exp-levels: int, commands: [cmd, ...], message: '...' }
#   - items[i]: { material, amount, name, lore[...], unbreakable,
#                 enchantments: { 'sharpness': 2, 'efficiency': 2, ... } }
# =========================================================================

