# =========================================================================
# TwixQuestPlugin — quests.yml
#
# Файл полностью настраиваемый. Квесты проходятся по порядку: засчитывается
# только первый невыполненный.
#
# ВЕРСИЯ ФАЙЛА. Плагин копирует quests.yml в plugins/TwixQuestPlugin/ один раз.
# Если на сервере лежит файл с меньшим config-version, плагин сохраняет его рядом
# как quests.yml.bak-... и кладёт новый. Меняете файл вручную — поднимите версию
# выше вшитой, и плагин ваш файл не тронет.
#
# ТИПЫ КВЕСТОВ (type):
#   DEPOSIT_ITEM    — ВЛОЖИТЬ предметы. Игрок кликает по квесту (ЛКМ в «Дереве квестов»),
#                     и из инвентаря забирается нужное количество; можно по частям, прогресс
#                     сохраняется. material + amount, а для нескольких предметов — extras.
#   CRAFT_ITEM      — скрафтить предмет. Засчитывается сам; если предмет уже в инвентаре,
#                     игрок кликает по квесту — предмет при этом НЕ забирается
#                     (consume: true — забирать).
#   KILL_MOB        — убить N мобов: entity-type + amount.
#   KILL_PLAYER     — убить игрока, наигравшего 30+ минут.
#   ENTER_WORLD     — оказаться в мире: world-env (NORMAL | NETHER | THE_END) или world-name.
#                     Работает через смену мира, а не через достижение: подходит и тем,
#                     кто уже получил достижение.
#   VISIT_STRUCTURE — оказаться внутри структуры: structure (ключ, напр. bastion_remnant).
#   TRADE_VILLAGER  — совершить сделку с жителем.
#   SELL_TO_BUYER   — продать байеру (ПКМ по товару в /buyer). material не указан —
#                     засчитывается любой предмет. count-buys: true — считать и покупки.
#   BUY_FROM_BUYER  — купить у байера (ЛКМ по товару в /buyer).
#   REACH_BALANCE   — иметь на счёте Vault не меньше amount монет.
#   MOUNT_STRIDER   — оседлать лавомерку.
#   MINE_BLOCK      — сломать N блоков: material + amount.
#
# ОБЩИЕ ПОЛЯ: name, description, type, amount, icon (материал иконки, необязательно),
#   silent (true — не объявлять выполнение в чат).
#
# НАГРАДА (reward):
#   items:        список предметов:
#     - material: DIAMOND_SWORD
#       amount: 1
#       name: "<gradient:#FF5E3A:#FFC371><bold>Название</bold></gradient>"   # цветное имя
#       lore: [ "строка" ]                                                   # необязательно
#       enchantments: { sharpness: 4, fire_aspect: 1 }   # ключи чар Minecraft
#       # для ENCHANTED_BOOK чары кладутся в книгу
#   vault-coins:  монеты Vault        twix-coins: Twixcoin (PlayerPoints)
#   exp-levels:   уровни опыта        commands: [ "give %player% ..." ]
#
# ВАЖНО: ресурсам (булыжник, слитки, жемчуг, ключи, стержни) имя НЕ давайте — именованный
# предмет не стакается с обычным, не подойдёт для вложения в другие квесты, а ключ
# испытаний с чужим названием может не открыть хранилище.
# =========================================================================

config-version: 4

# ---------------------------------------------------------------------------
# Настройки интеграции с байером (BaerPlugin / BuyerPlugin).
# Плагин не трогает байер: он определяет окно байера по заголовку GUI
# или по команде, а саму сделку — по изменению инвентаря игрока.
# ---------------------------------------------------------------------------
settings:
  # Слова в заголовке GUI байера (регистр не важен). У байера заголовок
  # "Байер » <категория>", так что по умолчанию хватает первых двух.
  buyer-gui-keywords:
    - "байер"
    - "баер"
    - "buyer"
    - "baer"
  # Команды, которые открывают байера (без слэша). Алиасы байера:
  # buyer, shop, магазин.
  buyer-command-labels:
    - "buyer"
    - "baer"
    - "shop"
    - "магазин"

