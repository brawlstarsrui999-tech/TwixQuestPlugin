name: build

# Проверка сборки: компилирует плагин против настоящего Paper API (Maven)
# и прикладывает готовый jar к запуску. Ошибки компилятора дополнительно
# выводятся аннотациями (видны на странице запуска и через API).
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile, test and package
        run: |
          set +e
          mvn -B -ntp -Dstyle.color=never package 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          python3 - <<'PY'
          import re
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          keep = [l for l in lines
                  if l.startswith('[ERROR]') or 'BUILD ' in l
                  or 'Tests run:' in l or l.startswith('[WARNING] /')
                  or l.strip().startswith('at twix.') or 'Caused by' in l]
          def enc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          level = 'error' if any('BUILD FAILURE' in l for l in lines) else 'notice'
          chunk, n = [], 0
          for l in keep[:540]:
              chunk.append(l[:600])
              if len(chunk) >= 60 and n < 9:
                  n += 1
                  print('::%s title=mvn log %d::%s' % (level, n, enc('\n'.join(chunk))))
                  chunk = []
          if chunk:
              print('::%s title=mvn log %d::%s' % (level, n + 1, enc('\n'.join(chunk))))
          PY
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: TwixQuestPlugin
          path: target/TwixQuestPlugin-*.jar
          if-no-files-found: error
