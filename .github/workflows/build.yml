name: build

# Проверка сборки: компилирует плагин против настоящего Paper API (Maven)
# и прикладывает готовый jar к запуску.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and package
        run: mvn -B -ntp -Dstyle.color=never package

      - uses: actions/upload-artifact@v4
        with:
          name: TwixQuestPlugin
          path: target/TwixQuestPlugin-*.jar
          if-no-files-found: error
